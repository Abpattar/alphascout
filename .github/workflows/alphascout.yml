name: AlphaScout Daily Run

# Times below are IST (Asia/Kolkata). Both runs happen before the Indian
# market opens, so every price is reported as PREVIOUS CLOSE, never as live.
on:
  schedule:
    - cron: "0 4 * * *"        # 04:00 IST - overnight news scan
      timezone: "Asia/Kolkata"
    - cron: "0 7 * * *"        # 07:00 IST - pre-market news scan
      timezone: "Asia/Kolkata"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything but do not send Telegram messages"
        required: false
        default: "false"
        type: boolean
      max_signals:
        description: "Max signals to send (hard cap 3)"
        required: false
        default: "3"
      freshness_hours:
        description: "Reject articles older than this"
        required: false
        default: "30"

# One run at a time. State is committed back to the repo, so two runs writing
# state concurrently would race on the same JSONL files.
concurrency:
  group: alphascout
  cancel-in-progress: false

permissions:
  contents: write   # required to commit state/*.jsonl back to the repository
  actions: read

jobs:
  alphascout:
    name: AlphaScout
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          # The state commit is on a bot branch; a detached shallow clone
          # cannot push back.
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Loads state/*.jsonl into the store. If this fails the run aborts:
      # running without memory would mean re-sending yesterday's news.
      - name: Preflight (store + credentials + market session)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --health

      - name: Run AlphaScout
        env:
          MODE: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_SIGNALS: ${{ github.event.inputs.max_signals || '3' }}
          FRESH: ${{ github.event.inputs.freshness_hours || '30' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
          GROQ_API_KEY_8: ${{ secrets.GROQ_API_KEY_8 }}
          GROQ_API_KEY_9: ${{ secrets.GROQ_API_KEY_9 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPHASCOUT_STORE: ${{ vars.ALPHASCOUT_STORE || 'git' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ALPHASCOUT_LOG_LEVEL: INFO
        run: |
          set -o pipefail
          args=(--signals "$MAX_SIGNALS" --freshness-hours "$FRESH")
          if [ "$MODE" = "true" ]; then args+=(--dry-run); fi
          python main.py run "${args[@]}" 2>&1 | tee run.log
          echo "### AlphaScout run log ###" >> "$GITHUB_STEP_SUMMARY"
          cat run.log >> "$GITHUB_STEP_SUMMARY"

      # Durability. Without this the next run starts blind and re-sends
      # everything already delivered.
      - name: Commit state
        if: always()
        run: |
          git config user.name  "alphascout-bot"
          git config user.email "alphascout-bot@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC') run checkpoint" || exit 0
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push attempt $i failed (likely concurrent push); rebasing"
            git pull --rebase origin main || exit 0
            sleep 5
          done
          echo "WARNING: could not persist state; next run may repeat signals."
          exit 0

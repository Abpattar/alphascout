name: AlphaScout Watchdog

# Safety net for GitHub's unreliable `schedule` cron. Runs 20 minutes after
# each main slot (04:00 and 07:00 IST); if the main workflow never fired, it
# hard-dispatches AlphaScout so no day is missed. The main run has a dedupe
# guard, so a late GitHub cron run can't double-send Telegram.
"on":
  schedule:
    - cron: "20 4 * * *"      # 04:20 IST — 20 min after the 04:00 slot
      timezone: "Asia/Kolkata"
    - cron: "20 7 * * *"      # 07:20 IST — 20 min after the 07:00 slot
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    name: Watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Count AlphaScout scheduled runs in the last ~2h
        id: check
        run: |
          since="$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          count="$(
            gh api \
              "repos/${{ github.repository }}/actions/runs?workflow_id=alphascout.yml&event=schedule&created=>=$since" \
              --jq '.total_count'
          )"
          echo "alpha_scout_runs_last_2h=$count"
          echo "count=${count:-0}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Dispatch AlphaScout if the scheduled run was missed
        if: steps.check.outputs.count == '0'
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/actions/workflows/alphascout.yml/dispatches" \
            -f ref=main -f 'inputs[reason]=watchdog'
          echo "Gamma: scheduled run was skipped by GitHub — dispatched AlphaScout manually."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Report status
        run: |
          if [ "${{ steps.check.outputs.count }}" == "0" ]; then
            echo "Gamma: scheduled AlphaScout run was MISSING -> manual dispatch sent."
          else
            echo "Gamma: AlphaScout already ran on schedule today, no action needed."
          fi
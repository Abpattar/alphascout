name: AlphaScout Watchdog

# Safety net for GitHub's unreliable `schedule` cron, which silently skips
# runs. Fires 20 minutes after each main slot and re-dispatches AlphaScout if
# no scheduled run appeared.
#
# Redundant dispatches are now harmless: the pipeline deduplicates against
# durable state, so a second run finds nothing new to send. Before the
# rewrite, a redundant dispatch could double-send.
on:
  schedule:
    - cron: "20 4 * * *"      # 04:20 IST - 20 min after the 04:00 slot
      timezone: "Asia/Kolkata"
    - cron: "20 7 * * *"      # 07:20 IST - 20 min after the 07:00 slot
      timezone: "Asia/Kolkata"
  workflow_dispatch:

# Same group as the main workflow: this must never race the main run's
# state commit.
concurrency:
  group: alphascout
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    name: Watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Did the scheduled AlphaScout run happen?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          LOOKBACK_MINUTES: ${{ github.event_name == 'schedule' && '25' || '60' }}
        run: |
          since="$(date -u -d "${LOOKBACK_MINUTES} minutes ago" +%Y-%m-%dT%H:%M:%SZ)"
          count="$(
            gh api \
              "repos/${{ github.repository }}/actions/runs?workflow_id=alphascout.yml&event=schedule&created=>=$since" \
              --jq '.total_count // 0'
          )"
          echo "Looked back ${LOOKBACK_MINUTES} min; scheduled runs found: ${count:-0}"
          echo "count=${count:-0}" >> "$GITHUB_OUTPUT"

      - name: Dispatch AlphaScout if the scheduled run was missed
        if: steps.check.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/actions/workflows/alphascout.yml/dispatches" \
            -f ref=main \
            -f 'inputs[dry_run]=false' \
            -f 'inputs[max_signals]=3'
          echo "Dispatched AlphaScout: the scheduled run was skipped by GitHub."
          echo "Dispatched AlphaScout (watchdog rescue)." >> "$GITHUB_STEP_SUMMARY"

      - name: Report
        if: steps.check.outputs.count != '0'
        run: |
          echo "Scheduled AlphaScout run was present - no action needed."
          echo "Scheduled AlphaScout run was present - no action needed." >> "$GITHUB_STEP_SUMMARY"

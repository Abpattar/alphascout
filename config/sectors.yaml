# Auto-discovery patterns for unknown companies in news
auto_discovery:
  patterns:
    - "([A-Z][A-Za-z]+\\s+(?:Ltd|Limited|Industries|Systems|Technologies|Defence|Aerospace|Engineering|Chemicals|Pharmaceuticals|Logistics|Infrastructure|Energy|Power|Motors|Auto|Steel|Metals|Textiles|Cement|Finance|Bank|Insurance))"
    - "([A-Z]{2,}\\s+(?:Ltd|Limited))"
  exclude:
    - "Government of India"
    - "Ministry of"
    - "Reserve Bank"
    - "Securities and Exchange"
    - "Stock Exchange"
    - "National Stock Exchange"
    - "Bombay Stock Exchange"
# Scraping settings
scraping:
  timeout: 10
  max_articles_per_source: 15
  total_timeout: 60
  parallel_workers: 8
  enrich_workers: 5
  enrich_timeout: 8
  dedupe_threshold: 0.85
  min_content_length: 100
  max_content_length: 3000

# Content enrichment selectors (fallback chain)
enrichment_selectors:
  - "article"
  - ".article-body"
  - ".story-content"
  - ".content-body"
  - ".article__content"
  - ".Normal"
  - ".articlebodycontent"
  - "main"
  - ".post-content"
  - "#content"
  - ".entry-content"
  - ".news-content"
  - ".detail-content"